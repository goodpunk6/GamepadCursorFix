name: Windows build and filter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test x86 and x64
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          New-Item -ItemType Directory -Path build -Force | Out-Null
          foreach ($arch in @('x86', 'x64')) {
            & $compiler /nologo /warnaserror /target:winexe /platform:$arch /out:build\GamepadCursorFix-$arch.exe GamepadCursorFix.cs
            if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
            & $compiler /nologo /warnaserror /target:exe /platform:$arch /main:FilterTests /out:build\FilterTests-$arch.exe GamepadCursorFix.cs tests\FilterTests.cs
            if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
            & ".\build\FilterTests-$arch.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Filter checks failed' }
          }
